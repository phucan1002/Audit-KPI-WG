const fmt = (n) => Math.round(n).toLocaleString("en-US");
function calc(s) {
  const actual = s.base * s.mkt / 100;
  const att = s.std > 0 ? actual * Math.min(s.act, s.std) / s.std : 0;
  const rate = s.met ? 0 : RATES[s.tier - 1];
  const eligible = s.tenure >= 6 && s.last >= 3;
  const standbyOn = s.standby && eligible && !s.met;
  const hold = standbyOn ? 0 : att * rate;
  const final = att - hold;
  const nextTier = s.met ? 1 : standbyOn ? s.tier : Math.min(s.tier + 1, 3);
  const accEst = att * RATES[s.tier - 1];
  const brkOk = s.netUsd >= 30000 && s.newIbs >= 2;
  return { actual, att, rate, eligible, standbyOn, hold, final, nextTier, accEst, brkOk };
}

      const ws = XLSX.utils.aoa_to_sheet([head, ...body, total]);
      ws["!cols"] = [14, 22, 8, 16, 8, 8, 8, 10, 8, 10, 16, 16, 16, 16, 18].map((w) => ({ wch: w }));
      ws["!freeze"] = { xSplit: 0, ySplit: 1 };
      XLSX.utils.book_append_sheet(wb, ws, t.shBatch.slice(0, 31));
    }
    return wb;
  };
  const doExport = (scope) => {
    try {
      const name = scope === "one" ? `WG_KPI_Audit_${s.id}_${month.replace(" ", "-")}.xlsx` : `WG_KPI_Batch_${region}_${month.replace(" ", "-")}.xlsx`;
      XLSX.writeFile(buildWb(scope), name);
      say("ok", `${t.exported}: ${name}`);
    } catch (e) { say("warn", t.exportFail); }
  };
  const doCopy = async (scope) => {
    const wb = buildWb(scope);
    const tsv = XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: "\t" });
    try { await navigator.clipboard.writeText(tsv); say("ok", t.copied); }
    catch (e) { say("warn", t.exportFail); }
  };
  const tierLabels = [t.t1, t.t2, t.t3];
  const regionName = { PH: t.pr, VN: t.vn, TR: t.tr };

  const steps = [
    { n: 1, icon: "target", title: t.s1, desc: t.s1d, val: fmt(r.actual) },
    { n: 2, icon: "cal", title: t.s2, desc: t.s2d, val: fmt(r.att) },
    { n: 3, icon: "shield", title: t.s3, desc: t.s3d, val: fmt(r.final) },
  ];

  return (
    <div className="min-h-screen" style={{ paddingLeft: "max(16px, env(safe-area-inset-left, 0px))", paddingRight: "max(16px, env(safe-area-inset-right, 0px))", paddingBottom: 32 }}>
      {/* header */}
      <header className="-mx-4 mb-6 bg-slate-900 px-4 py-4 text-slate-100 sm:-mx-0" style={{ marginLeft: "calc(-1 * max(16px, env(safe-area-inset-left, 0px)))", marginRight: "calc(-1 * max(16px, env(safe-area-inset-right, 0px)))", paddingLeft: "max(16px, env(safe-area-inset-left, 0px))", paddingRight: "max(16px, env(safe-area-inset-right, 0px))" }}>
        <div className="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-6 gap-y-3">
          <div className="flex min-w-0 items-center gap-3">
            <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-indigo-600"><Icon n="scale" s={20} c="text-white" /></div>
            <div className="min-w-0">
              <h1 className="text-[15px] font-semibold leading-tight sm:text-base">{t.app}</h1>
              <div className="mt-1 flex flex-wrap items-center gap-2 text-xs text-slate-300">
                <span className="num rounded bg-slate-800 px-1.5 py-0.5">v2.0 (Updated Nov 2026)</span>
                <span className="flex items-center gap-1.5 text-emerald-400"><span className="live-dot h-2 w-2 rounded-full bg-emerald-400" />{t.live}</span>
              </div>
            </div>
          </div>
          <div className="flex flex-wrap items-end gap-3">
            <div>
              <label htmlFor="f-region" className="mb-1 flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider text-slate-400"><Icon n="globe" s={11} />{t.region}</label>
              <select id="f-region" value={region} onChange={(e) => changeRegion(e.target.value)} className="rounded-md border border-slate-700 bg-slate-800 px-3 py-1.5 text-sm text-slate-100">
                {["PH","VN","TR"].map((c) => <option key={c} value={c}>{regionName[c]}</option>)}
              </select>
            </div>
            <div>
              <label htmlFor="f-month" className="mb-1 flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wider text-slate-400"><Icon n="cal" s={11} />{t.month}</label>
              <select id="f-month" value={month} onChange={(e) => setMonth(e.target.value)} className="rounded-md border border-slate-700 bg-slate-800 px-3 py-1.5 text-sm text-slate-100">
                {["Nov 2026","Oct 2026","Sep 2026"].map((m) => <option key={m}>{m}</option>)}
              </select>
            </div>
            <div className="flex overflow-hidden rounded-md border border-slate-700" role="group" aria-label="Language">
              {["en","vi"].map((l) => (
                <button key={l} onClick={() => setLang(l)} className={`px-3 py-1.5 text-sm font-semibold uppercase ${lang === l ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-300 hover:bg-slate-700"}`}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-7xl space-y-6">
        {/* stepper */}
        <nav aria-label="Salary computation steps" className="grid gap-3 md:grid-cols-3">
          {steps.map((st, i) => {
            const on = step === st.n;
            return (
              <button key={st.n} onClick={() => setStep(st.n)}
                className={`relative flex min-w-0 items-center gap-3 rounded-xl border p-4 text-left transition ${on ? "border-indigo-500 bg-slate-900 text-white shadow-lg" : "border-slate-200 bg-white text-slate-800 hover:border-indigo-300"}`}>
                <span className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${on ? "bg-indigo-500 text-white" : "bg-indigo-50 text-indigo-700"}`}><Icon n={st.icon} s={18} /></span>
                <span className="min-w-0 flex-1">
                  <span className={`block text-[10px] font-semibold uppercase tracking-wider ${on ? "text-indigo-300" : "text-slate-500"}`}>{t.step} {st.n}</span>
                  <span className="block truncate font-semibold">{st.title}</span>
                  <span className={`block text-xs ${on ? "text-slate-300" : "text-slate-500"}`}>{st.desc}</span>
                </span>
                <span className="text-right">
                  <span className={`num block text-sm font-semibold ${on ? "text-emerald-300" : "text-slate-900"}`}>{st.val}</span>
                  <span className={`text-[10px] ${on ? "text-slate-400" : "text-slate-400"}`}>VND</span>
                </span>
                {i < 2 && <span className="absolute -bottom-3 left-1/2 z-10 -translate-x-1/2 text-slate-400 md:-right-4 md:bottom-auto md:left-auto md:top-1/2 md:-translate-y-1/2 md:translate-x-0"><span className="hidden md:inline"><Icon n="arrow" s={16} /></span></span>}
              </button>
            );
          })}
        </nav>

        {toast && <div role="status" className={`fixed bottom-4 right-4 z-50 flex max-w-sm items-center gap-2 rounded-lg px-4 py-3 text-sm font-medium shadow-lg ${toast.kind === "ok" ? "bg-emerald-600 text-white" : "bg-amber-500 text-slate-900"}`} style={{ marginBottom: "env(safe-area-inset-bottom, 0px)" }}><Icon n={toast.kind === "ok" ? "check" : "alert"} s={16} />{toast.msg}</div>}
        {flash && <div role="status" className="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-2 text-emerald-800"><Icon n="check" s={16} />{t.loaded}: <b>{flash}</b></div>}

        <div className="grid gap-6 lg:grid-cols-5">
          {/* LEFT */}
          <div className="min-w-0 space-y-5 lg:col-span-3">
            <Panel title={t.meta} icon="user">
              <div className="grid gap-4 sm:grid-cols-2">
                <div><Label htmlFor="i-name">{t.name}</Label><input id="i-name" className={inputCls} value={s.name} onChange={(e) => up("name", e.target.value)} /></div>
                <div><Label htmlFor="i-id">{t.staff}</Label><input id="i-id" className={`${inputCls} num`} value={s.id} onChange={(e) => up("id", e.target.value)} /></div>
                <div><Label htmlFor="i-reg">{t.region}</Label>
                  <select id="i-reg" className={inputCls} value={s.id.split("-")[1] || region} onChange={(e) => changeRegion(e.target.value)}>
                    {["PH","VN","TR"].map((c) => <option key={c} value={c}>{regionName[c]}</option>)}
                  </select></div>
                <div><Label htmlFor="i-ten">{t.tenure}</Label><input id="i-ten" type="number" min="0" className={`${inputCls} num`} value={s.tenure} onChange={(e) => up("tenure", Math.max(0, +e.target.value || 0))} /></div>
              </div>
            </Panel>

            <Panel title={`${t.s1}`} icon="target" step={1} activeStep={step}>
              <div className="space-y-4">
                <div>
                  <Label htmlFor="i-base">{t.agreed}</Label>
                  <div className="relative">
                    <input id="i-base" className={`${inputCls} num pr-14 text-base font-semibold`} inputMode="numeric"
                      value={fmt(s.base)} onFocus={() => setStep(1)} onChange={(e) => up("base", +e.target.value.replace(/\D/g, "") || 0)} />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400">VND</span>
                  </div>
                </div>
                <div>
                  <Label>{t.mkt}</Label>
                  <div className="grid grid-cols-5 gap-2" role="radiogroup" aria-label={t.mkt}>
                    {[100,75,50,25,0].map((v) => (
                      <button key={v} role="radio" aria-checked={s.mkt === v} onClick={() => { up("mkt", v); setStep(1); }}
                        className={`num rounded-md border py-2 text-sm font-semibold transition ${s.mkt === v ? "border-indigo-600 bg-indigo-600 text-white" : "border-slate-300 bg-white text-slate-700 hover:border-indigo-400"}`}>{v}%</button>
                    ))}
                  </div>
                </div>
              </div>
            </Panel>

            <Panel title={t.att} icon="cal" step={2} activeStep={step}
              right={<span className="num text-xs font-semibold text-slate-500">{s.act}/{s.std} {t.days} = {(s.std ? (Math.min(s.act, s.std) / s.std) * 100 : 0).toFixed(1)}%</span>}>
              <div className="grid gap-4 sm:grid-cols-2">
                <div><Label htmlFor="i-std">{t.std}</Label><input id="i-std" type="number" min="1" max="31" className={`${inputCls} num`} value={s.std} onFocus={() => setStep(2)} onChange={(e) => up("std", Math.max(1, +e.target.value || 1))} /></div>
                <div><Label htmlFor="i-act">{t.act}</Label><input id="i-act" type="number" min="0" max="31" className={`${inputCls} num`} value={s.act} onFocus={() => setStep(2)} onChange={(e) => up("act", Math.max(0, +e.target.value || 0))} /></div>
              </div>
              <div className="mt-3 h-2 overflow-hidden rounded-full bg-slate-200" aria-hidden="true">
                <div className="h-full rounded-full bg-indigo-500 transition-all" style={{ width: `${Math.min(100, (s.act / s.std) * 100)}%` }} />
              </div>
            </Panel>

            <Panel title={t.sales} icon="trend" step={3} activeStep={step}>
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label={t.sales}>
                  <button role="radio" aria-checked={s.met} onClick={() => { up("met", true); setStep(3); }}
                    className={`flex items-center justify-center gap-2 rounded-md border py-2.5 font-semibold transition ${s.met ? "border-emerald-600 bg-emerald-600 text-white" : "border-slate-300 bg-white text-slate-700 hover:border-emerald-400"}`}><Icon n="check" s={16} />{t.met}</button>
                  <button role="radio" aria-checked={!s.met} onClick={() => { up("met", false); setStep(3); }}
                    className={`flex items-center justify-center gap-2 rounded-md border py-2.5 font-semibold transition ${!s.met ? "border-rose-600 bg-rose-600 text-white" : "border-slate-300 bg-white text-slate-700 hover:border-rose-400"}`}><Icon n="alert" s={16} />{t.missed}</button>
                </div>
                <div className={s.met ? "opacity-40" : ""}>
                  <Label htmlFor="i-tier">{t.tier}</Label>
                  <select id="i-tier" className={inputCls} disabled={s.met} value={s.tier} onChange={(e) => up("tier", +e.target.value)}>
                    {tierLabels.map((l, i) => <option key={i} value={i + 1}>{l}</option>)}
                  </select>
                </div>
              </div>
            </Panel>

            <Panel title={t.exc} icon="zap">
              <div className="space-y-3">
                <Toggle id="x-sb" on={s.standby} set={(v) => up("standby", v)} icon="shield" title={t.sb}
                  desc={<span className="flex flex-wrap items-center gap-2"><Badge tone={r.eligible ? "ok" : "warn"} icon={r.eligible ? "check" : "clock"}>{r.eligible ? t.sbElig : t.sbNo}</Badge><span>{t.sbTag}</span></span>}>
                  <div className="mt-2 flex items-center gap-2">
                    <label htmlFor="i-last" className="text-xs text-slate-500">{t.lastUse}</label>
                    <input id="i-last" type="number" min="0" className={`${inputCls} num !w-20 !py-1`} value={s.last} onChange={(e) => up("last", Math.max(0, +e.target.value || 0))} />
                  </div>
                </Toggle>
                <Toggle id="x-acc" on={s.accel} set={(v) => up("accel", v)} icon="zap" title={t.acc} desc={t.accD} />
                <Toggle id="x-brk" on={s.brk} set={(v) => up("brk", v)} icon="rocket" title={t.brk} desc={t.brkD}>
                  <div className="mt-2 grid grid-cols-2 gap-2">
                    <div><label htmlFor="i-net" className="text-xs text-slate-500">{t.netUsd}</label><input id="i-net" type="number" min="0" className={`${inputCls} num !py-1`} value={s.netUsd} onChange={(e) => up("netUsd", Math.max(0, +e.target.value || 0))} /></div>
                    <div><label htmlFor="i-ibs" className="text-xs text-slate-500">{t.newIbs}</label><input id="i-ibs" type="number" min="0" className={`${inputCls} num !py-1`} value={s.newIbs} onChange={(e) => up("newIbs", Math.max(0, +e.target.value || 0))} /></div>
                  </div>
                </Toggle>
              </div>
            </Panel>
          </div>

          {/* RIGHT */}
          <aside className="min-w-0 lg:col-span-2">
            <div className="space-y-4 lg:sticky lg:top-4">
              <section className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
                <div className="flex items-center justify-between gap-2 bg-slate-900 px-5 py-3 text-white">
                  <h2 className="flex items-center gap-2 text-[13px] font-semibold uppercase tracking-wider"><Icon n="file" s={16} c="text-indigo-300" />{t.summary}</h2>
                  <span className="num text-xs text-slate-400">{month}</span>
                </div>
                <div className="px-5 pt-4">
                  <div className="text-base font-semibold">{s.name || "—"}</div>
                  <div className="num text-xs text-slate-500">{s.id} · {regionName[s.id.split("-")[1]] || region} · {s.tenure}m</div>
                </div>
                <dl className="space-y-0 px-5 py-3">
                  {[
                    { k: t.rBase, v: fmt(s.base), tone: "text-slate-900", st: 0 },
                    { k: `${t.rMkt} (${s.mkt}%)`, v: fmt(r.actual), tone: "text-slate-900", st: 1 },
                    { k: `${t.rAtt} (${s.act}/${s.std})`, v: fmt(r.att), tone: "text-slate-900", st: 2 },
                    { k: r.standbyOn ? t.rSb : `${t.rHold} (${Math.round(r.rate * 100)}%)`, v: r.hold ? `-${fmt(r.hold)}` : "0", tone: r.hold ? "text-rose-600" : "text-slate-500", st: 3 },
                  ].map((row, i) => (
                    <div key={i} onClick={() => row.st && setStep(row.st)}
                      className={`flex items-baseline justify-between gap-3 border-b border-slate-100 py-2.5 last:border-0 ${row.st && step === row.st ? "-mx-2 rounded bg-indigo-50 px-2" : ""} ${row.st ? "cursor-pointer" : ""}`}>
                      <dt className="min-w-0 text-slate-600">
                        {row.st > 0 && <span className="mr-1.5 inline-flex h-4 w-4 items-center justify-center rounded-full bg-slate-200 text-[10px] font-bold text-slate-600">{row.st}</span>}{row.k}
                      </dt>
                      <dd className={`num shrink-0 font-semibold ${row.tone}`}>{row.v}</dd>
                    </div>
                  ))}
                </dl>
                <div className="mx-5 mb-5 rounded-xl bg-gradient-to-br from-indigo-700 to-blue-900 p-5 text-white">
                  <div className="text-[11px] font-semibold uppercase tracking-[0.18em] text-indigo-200">{t.final}</div>
                  <div className="mt-1 flex flex-wrap items-baseline gap-2">
                    <span className="num text-3xl font-semibold leading-none sm:text-4xl">{fmt(r.final)}</span>
                    <span className="text-sm font-semibold text-indigo-200">VND</span>
                  </div>
                  <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-white/15" aria-hidden="true">
                    <div className="h-full rounded-full bg-emerald-400 transition-all" style={{ width: `${s.base ? Math.min(100, (r.final / s.base) * 100) : 0}%` }} />
                  </div>
                  <div className="num mt-1.5 text-xs text-indigo-200">{s.base ? ((r.final / s.base) * 100).toFixed(1) : 0}% / {fmt(s.base)}</div>
                </div>
                <div className="border-t border-slate-100 px-5 py-4">
                  <div className="flex flex-wrap gap-2">
                    {s.met ? <Badge tone="ok" icon="check">[{t.pass}]</Badge> : <Badge tone="bad" icon="alert">[{t.hold} {Math.round(r.rate * 100)}%]</Badge>}
                    {r.standbyOn && <Badge tone="warn" icon="shield">[{t.standby}]</Badge>}
                    {s.met && <Badge tone="info" icon="refresh">[{t.reset}]</Badge>}
                    {!s.met && <Badge tone={r.nextTier === 3 ? "bad" : "warn"} icon="clock">[{t.next}: {Math.round(RATES[r.nextTier - 1] * 100)}%]</Badge>}
                    {!s.met && s.tier === 3 && <Badge tone="dark" icon="alert">[{t.zero}]</Badge>}
                  </div>
                  <div className="mt-4 grid grid-cols-5 gap-2">
                    <button onClick={() => doExport("one")} className="col-span-3 flex items-center justify-center gap-2 rounded-md bg-emerald-600 px-3 py-2.5 font-semibold text-white transition hover:bg-emerald-700"><Icon n="download" s={16} />{t.exportOne}</button>
                    <button onClick={() => doCopy("one")} className="col-span-2 flex items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-2.5 font-semibold text-slate-700 transition hover:border-indigo-400"><Icon n="copy" s={16} />{t.copyTbl}</button>
                  </div>
                </div>
              </section>

              {(s.accel || s.brk) && (
                <section className="rounded-xl border border-dashed border-indigo-300 bg-indigo-50/60 p-4">
                  <h3 className="mb-2 text-[11px] font-semibold uppercase tracking-wider text-indigo-700">{t.pending}</h3>
                  <ul className="space-y-2 text-slate-700">
                    {s.accel && <li className="flex items-baseline justify-between gap-3"><span>{t.accEst}</span><span className="num font-semibold text-emerald-700">+{fmt(r.accEst)}</span></li>}
                    {s.brk && <li className="flex items-start gap-2">{r.brkOk ? <Badge tone="ok" icon="rocket">OK</Badge> : <Badge tone="warn" icon="clock">—</Badge>}<span>{r.brkOk ? t.brkOk : t.brkNo}</span></li>}
                  </ul>
                </section>
              )}
            </div>
          </aside>
        </div>

        {/* batch table */}
        <section className="rounded-xl border border-slate-200 bg-white shadow-sm">
          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-5 py-4">
            <div>
              <h2 className="flex items-center gap-2 text-[13px] font-semibold uppercase tracking-wider text-slate-700"><Icon n="file" s={16} c="text-indigo-600" />{t.batch} · {regionName[region]}</h2>
              <p className="mt-0.5 text-xs text-slate-500">{t.sub} · {month}</p>
            </div>
            <div className="flex flex-wrap items-center gap-4">
              <div className="text-right"><div className="text-[10px] font-semibold uppercase tracking-wider text-slate-500">{t.totalPayout}</div><div className="num text-lg font-semibold">{fmt(batchTotal)} <span className="text-xs text-slate-400">VND</span></div></div>
              <div className="flex gap-2">
                <button onClick={() => doExport("batch")} className="flex items-center gap-2 rounded-md bg-emerald-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-emerald-700"><Icon n="download" s={14} />{t.exportBatch}</button>
                <button onClick={() => doCopy("batch")} className="flex items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:border-indigo-400"><Icon n="copy" s={14} />{t.copyTbl}</button>
              </div>
            </div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full min-w-[860px] text-left">
              <thead>
                <tr className="bg-slate-50 text-[11px] uppercase tracking-wider text-slate-500">
                  {t.cols.map((c, i) => <th key={c} className={`px-4 py-2.5 font-semibold ${i === 7 ? "text-right" : ""}`}>{c}</th>)}
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {rows.map(({ m, c }) => {
                  const active = m.id === s.id;
                  return (
                    <tr key={m.id} className={active ? "bg-indigo-50/60" : "hover:bg-slate-50"}>
                      <td className="num px-4 py-3 text-xs text-slate-600">{m.id}</td>
                      <td className="px-4 py-3 font-medium">{m.name}</td>
                      <td className="px-4 py-3"><span className="num rounded bg-slate-100 px-1.5 py-0.5 text-xs font-semibold text-slate-600">{m.id.split("-")[1]}</span></td>
                      <td className="num px-4 py-3">{m.mkt}%</td>
                      <td className="num px-4 py-3">{m.act}/{m.std}</td>
                      <td className="px-4 py-3">{m.met ? <Badge tone="ok">{t.met}</Badge> : <Badge tone="bad">{t.missed}</Badge>}</td>
                      <td className="num px-4 py-3">{c.standbyOn ? "0%" : `${Math.round(c.rate * 100)}%`}</td>
                      <td className="num px-4 py-3 text-right font-semibold">{fmt(c.final)}</td>
                      <td className="px-4 py-3">{m.met ? <Badge tone="ok" icon="check">{t.pass}</Badge> : c.standbyOn ? <Badge tone="warn" icon="shield">{t.standby.split(" ")[0]}</Badge> : <Badge tone="bad" icon="alert">{t.hold} {Math.round(c.rate * 100)}%</Badge>}</td>
                      <td className="px-4 py-3">
                        <button onClick={() => loadMember(m)} className={`rounded-md px-3 py-1.5 text-xs font-semibold transition ${active ? "bg-indigo-600 text-white" : "border border-indigo-300 text-indigo-700 hover:bg-indigo-50"}`}>{t.audit}</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </section>

        {/* legal */}
        <section className="flex items-start gap-4 rounded-xl border border-slate-700 bg-slate-900 p-5 text-slate-200">
          <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-400"><Icon n="scale" s={20} /></span>
          <div className="min-w-0">
            <h3 className="font-semibold text-white">{t.legalT}</h3>
            <p className="mt-1 max-w-3xl text-slate-300">{t.legal}</p>
          </div>
        </section>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
